name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  gates:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          [format, lint, typecheck, test, contract-e2e, build, package-audit, package-install-test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format
        if: matrix.gate == 'format'
        run: pnpm format:check
      - name: Lint
        if: matrix.gate == 'lint'
        run: pnpm lint
      - name: Typecheck
        if: matrix.gate == 'typecheck'
        run: pnpm typecheck
      - name: Tests
        if: matrix.gate == 'test'
        run: pnpm test
      - name: Contract E2E
        if: matrix.gate == 'contract-e2e'
        run: pnpm test:e2e
      - name: Build
        if: matrix.gate == 'build'
        run: pnpm build
      - name: Package audit/dry-run
        if: matrix.gate == 'package-audit'
        run: pnpm release:audit
      - name: External package install test
        if: matrix.gate == 'package-install-test'
        run: pnpm release:install-test

  stable-block:
    name: Stable is blocked until every gate and physical evidence pass
    if: always()
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all automated gates
        run: test "${{ needs.gates.result }}" = success
      - name: Keep physical release evidence explicit
        run: |
          test -f docs/support-evidence.json || exit 1
          echo "Physical iOS/Android evidence remains an RC requirement; CI does not fabricate it."
