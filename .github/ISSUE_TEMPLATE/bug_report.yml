name: Bug Report
description: File a sovereign-apps bug
labels: ['bug']
body:
  - type: textarea
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: input
    attributes:
      label: Platform
      description: Which app? (electron / react-native / landing)
  - type: textarea
    attributes:
      label: Peer IDs
      description: Node IDs involved (sanitized)
